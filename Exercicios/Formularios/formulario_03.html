<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
</head>
<body>
<h1>Pesquisa de satisfação do cliente</h1>
<form action="" method="post">
    <label>
        Nome:
        <input name="form_nome" type="text" placeholder="Digite seu nome completo" required>
    </label>
    <br>
    <br>

    <label>
        Empresa:
        <input name="form_empresa" type="text" placeholder="Digite sua empresa" required>
    </label>
    <br>
    <br>

    <label>
        Idade:
        <input name="form_idade" value="10-20" type="radio" required>
        10-20 Anos
    </label>

    <label>
        <input name="form_idade" value="20-30 Anos" type="radio" required>
        20-30 Anos
    </label>

    <label>
        <input name="form_idade" value="30-50 Anos" type="radio" required>
        30-50 Anos

    <label>
        <input name="form_idade" value="50-80 Anos" type="radio" required>
        50-80 Anos

     <br>
     <br>

    <label>
        Email:
        <input name="form_email" type="email" placeholder="Digite seu email" required>
    </label>
    <br>
    <br>

    <label>
        Telefone:
        <input name="form_telefone" type="tel" placeholder="Digite seu número" required>
    </label>
    <label>
        Celular:
        <input name="form_celular" type="tel" placeholder="Digite seu número" required>
    </label>
    <br>
    <br>

    <label>
        Como você avalia os nossos serviços atualmente?:
        <br>
        <input name="form_como_avalia_1" value="REGULAR" type="radio" required>
        REGULAR
    </>
    <label>
        <input name="form_como_avalia_1" value="BOM" type="radio" required>
        BOM
    </label>
    <label>
        <input name="form_como_avalia_1" value="EXELENTE" type="radio" required>
        EXELENTE

    </label>

     <br>
     <br>

    <label>
        Como você avalia os serviços na área operacional?:
        <br>
        <input name="form_como_avalia_2" value="REGULAR" type="radio" required>
        REGULAR
    </label>
    <label>
        <input name="form_como_avalia_2" value="BOM" type="radio" required>
        BOM
    </label>
    <label>
        <input name="form_como_avalia_2" value="EXELENTE" type="radio" required>
        EXELENTE

    </label>

    <br>
    <br>

    <label>
        Qual o nível de satisfaçãomcom o atendimento admisnistrativo quando você precisa?:
        <br>
        <input name="form_como_avalia_3" value="REGULAR" type="radio" required>
        REGULAR
    </label>
    <label>
        <input name="form_como_avalia_3" value="BOM" type="radio" required>
        BOM
    </label>
    <label>
        <input name="form_como_avalia_3" value="EXELENTE" type="radio" required>
        EXELENTE

    </label>

    <br>
    <br>

    <label>
        Os profissionais lhe atendem de forma satisfatória?:
        <br>
        <input name="form_como_avalia_4" value="NÃOS" type="radio" required>
        NÃO
    </label>
    <label>
        <input name="form_como_avalia_4" value="SIM" type="radio" required>
        SIM
    </label>

    <br>
    <br>

    <label>
        Você tem alguma sugestão ou crítica a fazer para cada vez mais melhorarmos nossos serviços?:
        <br>
        <textarea name="form_comentario" rows="10" cols="50"></textarea required>
    </label>

    <br>
    <br>
    <button type="submit">Salvar</button>
    <button type="reset">Limpar</button>
</body>
</html>
