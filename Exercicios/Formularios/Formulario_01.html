<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
</head>
<body>
<h1>Entrevista de emprego</h1>
<form action="" method="post">
    <label>
        Nome:
        <input name="form_nome" type="text" placeholder="Digite seu nome completo" required>
    </label>
    <br>
    <br>

    <label>
        Email:
        <input name="form_email" type="email" placeholder="Digite seu email" required>
    </label>
    <br>
    <br>
    <label>
        Assunto:
        <input name="form_assunto" type="text" placeholder="Digite" required>
    </label>
    <br>
    <br>

    <label>
        Mensagem:
        <textarea name="form_mensagem" rows="10" cols="50"></textarea required>
    </label>

    <br>
    <br>
    <button type="submit">Salvar</button>
    <button type="reset">Limpar</button>

</body>
</html>
